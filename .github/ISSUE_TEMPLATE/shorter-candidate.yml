name: Shorter TREE(3) candidate
description: Submit a potentially shorter verified implementation
title: "[candidate] "
labels: ["candidate"]
body:
  - type: input
    id: chars
    attributes:
      label: Claimed character count
      placeholder: "e.g. 544"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: Paste the complete candidate or link to a branch/commit.
      render: c
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler / architecture
      placeholder: "gcc 13.x, x86-64 Linux"
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed?
      description: Explain the compression idea and any new assumptions.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Verification output
      description: Include character count, TREE(1), TREE(2), embedding/generator checks and sanitizer results.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Candidate checklist
      options:
        - label: No fixed limits or hard-coded TREE results were introduced.
          required: true
        - label: The candidate compiles in the stated environment.
          required: true
        - label: TREE(1)=1 and TREE(2)=3.
          required: true
        - label: Embedding and generator regression checks pass.
          required: true
        - label: Any new compiler/runtime assumptions are disclosed.
          required: true
